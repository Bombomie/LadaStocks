<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="apple-touch-icon" sizes="180x180" href="/Images/Favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="Images/Favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="Images/Favicon/favicon-16x16.png">
    <link rel="manifest" href="Images/Favicon/site.webmanifest">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LadaStocks</title>
  <!-- Fixed: filename had a trailing space ("transactions.css ") -->
  <link rel="stylesheet" href="transactions.css" />
  <!-- Reusable navbar component (renders the header, active link,
       username and session guard). Needs no config. -->
  <script src="../shared/navbar.js" defer></script>
  <script src="transactions.js" defer></script>
</head>
<body>
  <!-- The old copy-pasted <header> block was replaced by this one line.
       It renders the navbar and marks "Transactions" active automatically. -->
  <lada-navbar></lada-navbar>

 <section class="content">
  <h1>Transactions</h1>
  <hr>
    <div class="transactions">
      <div class="transactions-panel">
        <h2>Transaction History</h2>
        <div class="table-wrap">
          <table class="transactions-table">
            <thead>
              <tr>
                <th>Trade Type</th>
                <th>Ticker</th>
                <th>Shares / $ Value</th>
                <th>Limit Price</th>
                <th>Current Price</th>
                <th>Trade Entered</th>
                <th>Confirmation</th>
                <th>Description</th>
              </tr>
            </thead>
            <tbody id="transactionsBody"></tbody>
          </table>
        </div>
        <div class="pagination" id="pagination"></div>
      </div>
    </div>
  </section>
</body>
</html>
