<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="apple-touch-icon" sizes="180x180" href="/Images/Favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="Images/Favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="Images/Favicon/favicon-16x16.png">
  <link rel="manifest" href="Images/Favicon/site.webmanifest">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LadaStocks - Charts</title>
  <link rel="stylesheet" href="charts.css" />
  <!-- Import Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header>
    <a href="../dashboard/dashboard.html" class="logo">
      <img src="../../Images/LadaStocks.png" alt="Lada Stocks logo">
    </a>

    <ul class="nav-links">
      <li><a href="../dashboard/dashboard.html">Dashboard</a></li>
      <li><a href="../portfolio/portfolio.html">Portfolio</a></li>
      <li><a href="../wallet/wallet.html">Wallet</a></li>
      <li><a href="../watchlist/watchlist.html">Watchlist</a></li>
      <li><a href="../transactions/transactions.html">Transactions</a></li>
      <li><a href="../charts/charts.html" class="active">Charts</a></li>
    </ul>

    <div class="nav-right">
      <span class="username">Username</span>
      <a href="../User/user.html">
        <img src="../../Images/profile.png" alt="User avatar" class="avatar">
      </a>
    </div>
  </header>
  
  <section class="content">
    <h1>Charts</h1>
    <hr>
    
    <!-- 1. Search Bar -->
    <div class="search-bar-wrapper" style="margin-bottom: 20px; display: flex; gap: 10px; align-items: center;">
      <input type="text" id="symbolInput" class="search-input" placeholder="Enter stock ticker (e.g. AAPL, TSLA)..." style="padding: 10px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.3); background: rgba(0,0,0,0.2); color: white; width: 300px;" />
      <button class="search-btn" id="searchBtn" onclick="searchStock()" style="padding: 10px 20px; border-radius: 50px; background: #FFC349; color: #0a1f44; border: none; font-weight: bold; cursor: pointer;">Search</button>
      <span id="statusMsg" class="status-msg" style="color: #ccc; font-size: 14px;"></span>
    </div>

    <!-- 2. MAIN CHART WIDGET -->
    <div class="main-chart">
      
      <!-- LEFT COLUMN: Title -->
      <h2 id="stockTitle" style="grid-column: 1; grid-row: 1;">Search a stock to view its chart</h2>

      <!-- LEFT COLUMN: The Chart -->
      <!-- By setting grid-column: 1, it stays OUT of the white box! -->
      <div style="grid-column: 1; grid-row: 2 / span 2; position: relative; height: 100%; min-height: 400px; width: 100%;">
        <canvas id="customStockChart"></canvas>
      </div>

      <!-- RIGHT COLUMN: The White Box -->
      <div class="chart-box">
         <!-- This remains your white box sidebar. You can leave it empty or put stock stats here later! -->
      </div>

      <!-- RIGHT COLUMN: The Buttons -->
      <div class="chart-actions">
        <button class="btn-watchlist">Add to watchlist</button>
        <button class="btn-alert">Set price alert</button>
      </div>

    </div>
  </section>

  <!-- Twelve Data Script -->
  <script>
    let chartInstance = null;
    
    // Twelve Data API Key
    const TWELVE_DATA_API_KEY = '1bbc7128e8314b2ba1c869f85b9898b2'; 

    document.getElementById('symbolInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') searchStock();
    });

    async function searchStock() {
      const input = document.getElementById('symbolInput');
      const status = document.getElementById('statusMsg');
      const title = document.getElementById('stockTitle');
      const symbol = input.value.trim().toUpperCase();

      if (!symbol) return;

      status.textContent = `Fetching data for ${symbol}...`;

      try {
        const url = `https://api.twelvedata.com/time_series?symbol=${symbol}&interval=1day&outputsize=90&apikey=${TWELVE_DATA_API_KEY}`; 
        
        const response = await fetch(url);
        const json = await response.json();

        if (json.status === 'ok' && json.values) { 
          const historicalData = json.values.reverse(); 
          
          const dates = historicalData.map(day => {
            const dateObj = new Date(day.datetime); 
            return dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
          });
          
          const closes = historicalData.map(day => parseFloat(day.close).toFixed(2));
          
          title.textContent = `${symbol} - 3 Month Performance`;
          renderChart(symbol, dates, closes);
          status.textContent = ''; 
        } else {
          throw new Error(json.message || 'Symbol not found');
        }
      } catch (err) {
        console.error('API Error:', err);
        status.textContent = `Could not load data for "${symbol}". Check ticker.`;
      }
    }

    function renderChart(ticker, labels, dataPoints) {
      const ctx = document.getElementById('customStockChart').getContext('2d');

      if (chartInstance) {
        chartInstance.destroy();
      }

      const gradient = ctx.createLinearGradient(0, 0, 0, 400);
      gradient.addColorStop(0, 'rgba(255, 195, 73, 0.35)');
      gradient.addColorStop(1, 'rgba(255, 195, 73, 0.0)');

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: `${ticker} Daily Close ($)`,
            data: dataPoints,
            borderColor: '#FFC349',
            borderWidth: 2,
            backgroundColor: gradient,
            fill: true,
            tension: 0.25,
            pointRadius: 0,
            pointHoverRadius: 6,
            pointHoverBackgroundColor: '#FFC349',
            pointHoverBorderColor: '#0a1f44',
            pointHoverBorderWidth: 2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: {
            intersect: false,
            mode: 'index',
          },
          plugins: {
            legend: {
              labels: {
                color: 'white',
                font: { family: 'Jost', size: 14 }
              }
            },
            tooltip: {
              backgroundColor: 'rgba(10, 31, 68, 0.9)',
              titleFont: { family: 'Jost' },
              bodyFont: { family: 'Jost' },
              borderColor: 'rgba(255, 255, 255, 0.15)',
              borderWidth: 1
            }
          },
          scales: {
            x: {
              ticks: { color: 'rgba(255, 255, 255, 0.7)', font: { family: 'Jost' } },
              grid: { color: 'rgba(255, 255, 255, 0.06)' }
            },
            y: {
              ticks: { color: 'rgba(255, 255, 255, 0.7)', font: { family: 'Jost' } },
              grid: { color: 'rgba(255, 255, 255, 0.06)' }
            }
          }
        }
      });
    }

    // Automatically load AAPL when the page opens
    window.onload = () => {
      document.getElementById('symbolInput').value = 'AAPL';
      searchStock();
    };
  </script>
</body>
</html>
