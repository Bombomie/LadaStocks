<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="apple-touch-icon" sizes="180x180" href="/Images/Favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="Images/Favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="Images/Favicon/favicon-16x16.png">
    <link rel="manifest" href="Images/Favicon/site.webmanifest">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LadaStocks</title>
  <link rel="stylesheet" href="charts.css" />
  <script src="charts.js" defer></script>
</head>
<body>
  <header>
    <a href="../dashboard/dashboard.html" class="logo">
      <img src="../../Images/LadaStocks.png" alt="Lada Stocks logo">
    </a>

    <ul class="nav-links">
      <li><a href="../dashboard/dashboard.html">Dashboard</a></li>
      <li><a href="../portfolio/portfolio.html">Portfolio</a></li>
      <li><a href="../wallet/wallet.html">Wallet</a></li>
      <li><a href="../watchlist/watchlist.html">Watchlist</a></li>
      <li><a href="../transactions/transactions.html">Transactions</a></li>
      <li><a href="../charts/charts.html" class="active">Charts</a></li>
    </ul>

    <div class="nav-right">
      <span class="username">Username</span>
      <a href="../User/user.html">
        <img src="../../Images/profile.png" alt="User avatar" class="avatar">
      </a>
    </div>
  </header>
  <section class="content">
    <h1>Charts</h1>
    <hr>
      <div class="main-chart">
  <h2>Stock Name</h2>

  <div class="chart-toolbar">
  <div class="search-bar">
    <input type="text" class="search-input" id="stockSearch" placeholder="Search stocks...">
    <button class="search-btn" type="submit">
      <img src="../../Images/SVG/search.svg" class="search-icon" alt="Search">
    </button>
  </div>

  <div class="chart-tools">
  <button class="tool-btn" data-mode="pan" title="Pan">
    <img src="../../Images/SVG/hand.svg" class="tool-icon" alt="Pan">
  </button>
  <button class="tool-btn" data-mode="zoom" title="Zoom">
    <img src="../../Images/SVG/zoom.svg" class="tool-icon" alt="Zoom">
  </button>
  <button class="tool-btn" data-mode="drawline" title="Draw line">
    <img src="../../Images/SVG/line.svg" class="tool-icon" alt="Draw line">
  </button>
  <button class="tool-btn" data-mode="drawrect" title="Draw rectangle">
    <img src="../../Images/SVG/rectangle.svg" class="tool-icon" alt="Draw rectangle">
  </button>
  <button class="tool-btn" data-mode="drawcircle" title="Draw circle">
    <img src="../../Images/SVG/circle.svg" class="tool-icon" alt="Draw circle">
  </button>
  <button class="tool-btn" id="toolAnnotate" title="Add annotation">
    <img src="../../Images/SVG/annotation.svg" class="tool-icon" alt="Add annotation">
  </button>
  <button class="tool-btn" data-mode="eraseshape" title="Erase shape">
    <img src="../../Images/SVG/erase.svg" class="tool-icon" alt="Erase shape">
  </button>
  <button class="tool-btn" id="toolReset" title="Reset view">
    <img src="../../Images/SVG/reset.svg" class="tool-icon" alt="Reset view">
  </button>
</div>
</div>

  <div class="chart-box" id="candleChart"></div>

  <div class="details-panel" id="detailsPanel">
    <p class="details-empty">Select a stock to see details.</p>
  </div>

  <div class="chart-actions">
    <button class="btn-watchlist">Add to watchlist</button>
    <button class="btn-alert">Set price alert</button>
  </div>
</div>

<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  </section>
</body>
</html>
