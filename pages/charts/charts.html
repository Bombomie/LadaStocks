      <div class="main-chart">
  <h2>Stock Name</h2>

  <div class="chart-toolbar">
  <div class="search-bar">
    <input type="text" class="search-input" id="stockSearch" placeholder="Search stocks...">
    <button class="search-btn" type="submit">
      <img src="../../Images/SVG/search.svg" class="search-icon" alt="Search">

  <div class="chart-tools">

  </button>
  <button class="tool-btn" data-mode="zoom" title="Zoom">
    <img src="../../Images/SVG/zoom.svg" class="tool-icon" alt="Zoom">
  </button>
  <button class="tool-btn" data-mode="drawline" title="Draw line">

  </button>
  <button class="tool-btn" data-mode="drawrect" title="Draw rectangle">
    <img src="../../Images/SVG/rectangle.svg" class="tool-icon" alt="Draw rectangle">

</div>
</div>

  <div class="chart-box" id="candleChart"></div>

  </div>

  <div class="chart-actions">

    <button class="btn-alert">Set price alert</button>
  </div>
</div>

<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  </section>

  <!-- Twelve Data Script -->
  <script>
    let chartInstance = null;
    
    // Twelve Data API Key
    const TWELVE_DATA_API_KEY = '1bbc7128e8314b2ba1c869f85b9898b2'; 

    document.getElementById('symbolInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') searchStock();
    });

    async function searchStock() {
      const input = document.getElementById('symbolInput');
      const status = document.getElementById('statusMsg');
      const title = document.getElementById('stockTitle');
      const symbol = input.value.trim().toUpperCase();

      if (!symbol) return;

      status.textContent = `Fetching data for ${symbol}...`;

      try {
        const url = `https://api.twelvedata.com/time_series?symbol=${symbol}&interval=1day&outputsize=90&apikey=${TWELVE_DATA_API_KEY}`; 
        
        const response = await fetch(url);
        const json = await response.json();

        if (json.status === 'ok' && json.values) { 
          const historicalData = json.values.reverse(); 
          
          const dates = historicalData.map(day => {
            const dateObj = new Date(day.datetime); 
            return dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
          });
          
          const closes = historicalData.map(day => parseFloat(day.close).toFixed(2));
          
          title.textContent = `${symbol} - 3 Month Performance`;
          renderChart(symbol, dates, closes);
          status.textContent = ''; 
        } else {
          throw new Error(json.message || 'Symbol not found');
        }
      } catch (err) {
        console.error('API Error:', err);
        status.textContent = `Could not load data for "${symbol}". Check ticker.`;
      }
    }

    function renderChart(ticker, labels, dataPoints) {
      const ctx = document.getElementById('customStockChart').getContext('2d');

      if (chartInstance) {
        chartInstance.destroy();
      }

      const gradient = ctx.createLinearGradient(0, 0, 0, 400);
      gradient.addColorStop(0, 'rgba(255, 195, 73, 0.35)');
      gradient.addColorStop(1, 'rgba(255, 195, 73, 0.0)');

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: `${ticker} Daily Close ($)`,
            data: dataPoints,
            borderColor: '#FFC349',
            borderWidth: 2,
            backgroundColor: gradient,
            fill: true,
            tension: 0.25,
            pointRadius: 0,
            pointHoverRadius: 6,
            pointHoverBackgroundColor: '#FFC349',
            pointHoverBorderColor: '#0a1f44',
            pointHoverBorderWidth: 2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: {
            intersect: false,
            mode: 'index',
          },
          plugins: {
            legend: {
              labels: {
                color: 'white',
                font: { family: 'Jost', size: 14 }
              }
            },
            tooltip: {
              backgroundColor: 'rgba(10, 31, 68, 0.9)',
              titleFont: { family: 'Jost' },
              bodyFont: { family: 'Jost' },
              borderColor: 'rgba(255, 255, 255, 0.15)',
              borderWidth: 1
            }
          },
          scales: {
            x: {
              ticks: { color: 'rgba(255, 255, 255, 0.7)', font: { family: 'Jost' } },
              grid: { color: 'rgba(255, 255, 255, 0.06)' }
            },
            y: {
              ticks: { color: 'rgba(255, 255, 255, 0.7)', font: { family: 'Jost' } },
              grid: { color: 'rgba(255, 255, 255, 0.06)' }
            }
          }
        }
      });
    }

    // Automatically load AAPL when the page opens
    window.onload = () => {
      document.getElementById('symbolInput').value = 'AAPL';
      searchStock();
    };
  </script>
</body>
