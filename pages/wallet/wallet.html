<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="apple-touch-icon" sizes="180x180" href="/Images/Favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="Images/Favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="Images/Favicon/favicon-16x16.png">
    <link rel="manifest" href="Images/Favicon/site.webmanifest">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LadaStocks</title>
  <link rel="stylesheet" href="wallet.css" />
  <script src="wallet.js" defer></script>
</head>
<body>
  <header>
    <a href="../dashboard/dashboard.html" class="logo">
      <img src="../../Images/LadaStocks.png" alt="Lada Stocks logo">
    </a>

    <ul class="nav-links">
      <li><a href="../dashboard/dashboard.html">Dashboard</a></li>
      <li><a href="../portfolio/portfolio.html">Portfolio</a></li>
      <li><a href="../wallet/wallet.html" class="active">Wallet</a></li>
      <li><a href="../watchlist/watchlist.html">Watchlist</a></li>
      <li><a href="../transactions/transactions.html">Transactions</a></li>
      <li><a href="../charts/charts.html">Charts</a></li>
    </ul>

    <div class="nav-right">
      <span class="username">Username</span>
      <a href="../User/user.html">
        <img src="../../Images/profile.png" alt="User avatar" class="avatar">
      </a>
    </div>
  </header>
  <section class="content">
  <h1>Wallet</h1>
  <hr>

  <div class="summary-strip" id="walletSummary">
    <div class="summary-card">
      <span class="summary-label">Cash Balance</span>
      <span class="summary-value" id="cashBalance">$0.00</span>
    </div>
    <div class="summary-card">
      <span class="summary-label">Portfolio Value</span>
      <span class="summary-value" id="portfolioValue">$0.00</span>
    </div>
    <div class="summary-card">
      <span class="summary-label">Total Earning (Sells)</span>
      <span class="summary-value up" id="totalEarning">$0.00</span>
    </div>
    <div class="summary-card">
      <span class="summary-label">Total Spending (Buys)</span>
      <span class="summary-value down" id="totalSpending">$0.00</span>
    </div>
  </div>

  <div class="lower-grid">
    <div class="watchlist-panel">
      <h2>Balance History</h2>
      <canvas id="balanceChart" height="90"></canvas>
    </div>

    <div class="details-panel">
  <h2>Manage Funds</h2>
  <div class="wallet-actions">
    <input type="number" id="fundAmount" placeholder="Amount" min="0" step="0.01" />
    <div class="details-actions">
      <button class="buy-btn" id="depositBtn" type="button">Deposit</button>
      <button class="sell-btn" id="withdrawBtn" type="button">Withdraw</button>
    </div>
  </div>
  </div>
</div>
</body>
</html>
