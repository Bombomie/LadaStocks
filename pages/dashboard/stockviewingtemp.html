<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LadaStocks - Global Search & Chart</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 20px; }
        #chart { width: 100%; max-width: 800px; height: 400px; margin-top: 20px; }
        
        /* Search Bar Styles */
        .search-container { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 20px; }
        .input-wrapper { position: relative; width: 320px; }
        input { width: 100%; box-sizing: border-box; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 16px; font-size: 16px; cursor: pointer; border: none; background: #2962FF; color: white; border-radius: 4px; }
        
        /* Dropdown Styles */
        .suggestions-list { position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid #ccc; border-top: none; border-radius: 0 0 6px 6px; max-height: 240px; overflow-y: auto; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.12); display: none; }
        .suggestion-item { padding: 10px 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f2f2f2; font-size: 14px; }
        .suggestion-item:last-child { border-bottom: none; }
        .suggestion-item:hover { background-color: #f0f4ff; }
        .suggestion-symbol { font-weight: bold; color: #2962FF; }
        .suggestion-desc { color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-left: 10px; font-size: 12px; }

        /* Fallback Card Styles */
        .fallback-card { max-width: 800px; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 20px; margin-top: 20px; display: none; }
        .fallback-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e5e7eb; padding-bottom: 10px; margin-bottom: 15px; }
        .fallback-header h3 { margin: 0; font-size: 20px; }
        .fallback-price { font-size: 24px; font-weight: bold; color: #111827; }
        .fallback-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
        .stat-box label { color: #6b7280; font-size: 13px; display: block; margin-bottom: 4px; }
        .stat-box span { font-weight: 600; font-size: 16px; color: #374151; }
        .fallback-links a { text-decoration: none; color: white; background: #2962FF; padding: 10px 15px; border-radius: 4px; font-size: 14px; margin-right: 10px; display: inline-block; transition: background 0.2s; }
        .fallback-links a:hover { background: #1e4bd8; }
    </style>
</head>
<body>

    <div class="search-container">
        <div class="input-wrapper">
            <input type="text" id="searchInput" placeholder="Search global stocks (e.g., Apple, TSLA, 00940)" autocomplete="off">
            <div id="suggestions" class="suggestions-list"></div>
        </div>
        <button onclick="searchStock()">Search</button>
    </div>

    <h2 id="stockTitle">Search a stock to view its chart</h2>
    
    <!-- Fallback UI Card (Hidden by default) -->
    <div id="fallbackCard" class="fallback-card">
        <div class="fallback-header">
            <h3 id="fallbackName">--</h3>
            <span id="fallbackPrice" class="fallback-price">--</span>
        </div>
        <div class="fallback-stats">
            <div class="stat-box"><label>Day High</label> <span id="fallbackHigh">--</span></div>
            <div class="stat-box"><label>Day Low</label> <span id="fallbackLow">--</span></div>
            <div class="stat-box"><label>Open</label> <span id="fallbackOpen">--</span></div>
            <div class="stat-box"><label>Prev Close</label> <span id="fallbackClose">--</span></div>
        </div>
        <div class="fallback-links">
            <a id="linkTV" href="#" target="_blank">View full interactive chart</a>
        </div>
    </div>

    <!-- Chart Container -->
    <div id="chart"></div>

    <script>
        const API_KEY = 'daemn51r01qqo7nt42hgdaemn51r01qqo7nt42i0'; 
        const searchInput = document.getElementById('searchInput');
        const suggestionsList = document.getElementById('suggestions');
        let debounceTimer;

        // Listen for typing and fetch suggestions
        searchInput.addEventListener('input', (e) => {
            clearTimeout(debounceTimer);
            const query = e.target.value.trim();
            if (query.length < 1) { hideSuggestions(); return; }
            debounceTimer = setTimeout(() => fetchSuggestions(query), 300);
        });

        // Query Finnhub for matching symbols
        async function fetchSuggestions(query) {
            try {
                const res = await fetch(`https://finnhub.io/api/v1/search?q=${encodeURIComponent(query)}&token=${API_KEY}`);
                const data = await res.json();
                if (data.result && data.result.length > 0) {
                    renderSuggestions(data.result.slice(0, 6)); 
                } else {
                    hideSuggestions();
                }
            } catch (err) {
                console.error("Failed to fetch suggestions:", err);
                hideSuggestions();
            }
        }

        // Render dropdown items
        function renderSuggestions(matches) {
            suggestionsList.innerHTML = '';
            matches.forEach(item => {
                if (!item.symbol) return;
                const row = document.createElement('div');
                row.className = 'suggestion-item';
                row.innerHTML = `<span class="suggestion-symbol">${item.symbol}</span><span class="suggestion-desc">${item.description}</span>`;
                row.addEventListener('click', () => selectStock(item.symbol, item.description));
                suggestionsList.appendChild(row);
            });
            suggestionsList.style.display = 'block';
        }

        function hideSuggestions() {
            suggestionsList.innerHTML = '';
            suggestionsList.style.display = 'none';
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.input-wrapper')) hideSuggestions();
        });

        // Fallback Manual Search
        async function searchStock() {
            const query = searchInput.value.trim();
            if (!query) return;
            hideSuggestions();
            document.getElementById('stockTitle').innerText = `Searching for "${query}"...`;
            try {
                const res = await fetch(`https://finnhub.io/api/v1/search?q=${encodeURIComponent(query)}&token=${API_KEY}`);
                const data = await res.json();
                if (data.count > 0) {
                    const topMatch = data.result[0];
                    selectStock(topMatch.symbol, topMatch.description);
                } else {
                    document.getElementById('stockTitle').innerText = "No stocks found.";
                }
            } catch (error) {
                console.error("Error searching:", error);
                document.getElementById('stockTitle').innerText = "Error searching for stock.";
            }
        }

        // Determine Fallback vs Chart routing
        function selectStock(symbol, description) {
            searchInput.value = symbol;
            hideSuggestions();
            
            const chartContainer = document.getElementById('chart');
            const fallbackCard = document.getElementById('fallbackCard');
            const stockTitle = document.getElementById('stockTitle');
            
            let chartSymbol = symbol;
            
            // Check if it is a Taiwan stock that TradingView blocks
            const isRestricted = symbol.endsWith('.TW'); 
            
            if (isRestricted) {
                chartSymbol = 'TWSE:' + chartSymbol.replace('.TW', '');
                stockTitle.innerText = `${description} (${symbol}) - Embedded Chart Restricted`;
                chartContainer.innerHTML = ''; // Prevent the broken chart from rendering
            } else {
                stockTitle.innerText = `${description} (${symbol})`;
                loadTradingViewWidget(chartSymbol);
            }

            // Always show the fallback stats card and fetch live price data
            fallbackCard.style.display = 'block';
            fetchFallbackData(symbol, description, chartSymbol);
        }

        // Fetch live real-time Quote from Finnhub for the Fallback Card
        async function fetchFallbackData(symbol, description, tvSymbol) {
            try {
                const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${symbol}&token=${API_KEY}`);
                const data = await res.json();
                
                document.getElementById('fallbackName').innerText = description;
                document.getElementById('fallbackPrice').innerText = data.c ? '$' + data.c.toFixed(2) : '--';
                document.getElementById('fallbackHigh').innerText = data.h ? '$' + data.h.toFixed(2) : '--';
                document.getElementById('fallbackLow').innerText = data.l ? '$' + data.l.toFixed(2) : '--';
                document.getElementById('fallbackOpen').innerText = data.o ? '$' + data.o.toFixed(2) : '--';
                document.getElementById('fallbackClose').innerText = data.pc ? '$' + data.pc.toFixed(2) : '--';
                
                // Button opens the actual TradingView page in a new tab
                document.getElementById('linkTV').href = `https://www.tradingview.com/chart/?symbol=${tvSymbol}`;
            } catch (err) {
                console.error("Error fetching fallback data", err);
            }
        }

        // Inject the Interactive TradingView Advanced Chart
        function loadTradingViewWidget(symbol) {
            const container = document.getElementById('chart');
            container.innerHTML = ''; 

            const widgetContainer = document.createElement('div');
            widgetContainer.className = 'tradingview-widget-container__widget';
            widgetContainer.style.height = "100%"; 
            widgetContainer.style.width = "100%";
            container.appendChild(widgetContainer);

            const script = document.createElement('script');
            script.type = 'text/javascript';
            script.src = 'https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js';
            script.async = true;
            script.innerHTML = JSON.stringify({
                "autosize": true,
                "symbol": symbol,
                "interval": "D",
                "timezone": "Etc/UTC",
                "theme": "light",
                "style": "3",
                "locale": "en",
                "enable_publishing": false,
                "hide_top_toolbar": false,
                "hide_legend": true,
                "save_image": false,
                "support_host": "https://www.tradingview.com"
            });

            container.appendChild(script);
        }
    </script>
</body>
</html>
