<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="apple-touch-icon" sizes="180x180" href="/Images/Favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="Images/Favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="Images/Favicon/favicon-16x16.png">
    <link rel="manifest" href="Images/Favicon/site.webmanifest">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LadaStocks</title>
  <link rel="stylesheet" href="dashboard.css" />
  <script src="../shared/navbar.js" defer></script>
</head>
<body>
  <!-- The entire <header> block is replaced by one custom element.
       It renders the navbar, marks the active link, loads the
       username and guards the session (redirects on 401). -->
  <lada-navbar></lada-navbar>

  <section class="content">
    <h1>Dashboard</h1>
    <hr>

    <div class="dashboard-grid">
      <!-- General Market News Feed -->
      <div class="card large">
        <div class="tradingview-widget-container" style="height: 100%; width: 100%;">
          <div class="tradingview-widget-container__widget" style="height: 100%; width: 100%;"></div>
          <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-timeline.js" async>
          {
            "feedMode": "all_symbols",
            "isTransparent": true,
            "displayMode": "regular",
            "width": "100%",
            "height": "100%",
            "colorTheme": "dark",
            "locale": "en"
          }
          </script>
        </div>
      </div>

      <!-- S&P 500 Mini Chart -->
      <div class="card small">
        <div class="tradingview-widget-container" style="height: 100%; width: 100%;">
          <div class="tradingview-widget-container__widget" style="height: 100%; width: 100%;"></div>
          <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js" async>
          {
          "symbol": "AMEX:SPY",
          "width": "100%",
          "height": "100%",
          "locale": "en",
          "dateRange": "12M",
          "colorTheme": "dark",
          "isTransparent": true,
          "autosize": true,
          "largeChartUrl": ""
        }
          </script>
        </div>
      </div>

      <!-- Brent Oil Mini Chart -->
      <div class="card small">
        <div class="tradingview-widget-container" style="height: 100%; width: 100%;">
          <div class="tradingview-widget-container__widget" style="height: 100%; width: 100%;"></div>
          <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js" async>
          {
          "symbol": "SKILLING:BRENT",
          "width": "100%",
          "height": "100%",
          "locale": "en",
          "dateRange": "12M",
          "colorTheme": "dark",
          "isTransparent": true,
          "autosize": true,
          "largeChartUrl": ""
        }
          </script>
        </div>
      </div>

      <!-- Nasdaq (QQQ) Mini Chart -->
      <div class="card small">
        <div class="tradingview-widget-container" style="height: 100%; width: 100%;">
          <div class="tradingview-widget-container__widget" style="height: 100%; width: 100%;"></div>
          <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js" async>
          {
          "symbol": "NASDAQ:QQQ",
          "width": "100%",
          "height": "100%",
          "locale": "en",
          "dateRange": "12M",
          "colorTheme": "dark",
          "isTransparent": true,
          "autosize": true,
          "largeChartUrl": ""
        }
          </script>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
