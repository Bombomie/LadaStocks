<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="apple-touch-icon" sizes="180x180" href="/Images/Favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../../Images/Favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../../Images/Favicon/favicon-16x16.png">
  <link rel="manifest" href="../../Images/Favicon/site.webmanifest">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LadaStocks - Dashboard</title>
  <link rel="stylesheet" href="dashboard.css" />
  <script src="../shared/navbar.js" defer></script>
  <script src="dashboard.js" defer></script>
</head>
<body>
  <lada-navbar></lada-navbar>

  <section class="content">
    <div class="dash-head">
      <h1>Dashboard</h1>
      <span id="marketStatusBadge" class="market-badge">US Market: Checking...</span>
    </div>
    <hr>

    <!-- Admin Announcements -->
    <div id="announcementsSection" class="announcements-panel" hidden>
      <div class="section-header">
        <h2>Admin Announcements</h2>
      </div>
      <div id="announcementsFeed" class="announcements-feed"></div>
    </div>

    <!-- Account KPI Summary Strip -->
    <div class="summary-strip" id="dashSummary">
      <div class="summary-card">
        <span class="summary-label">Net Worth</span>
        <span class="summary-value" id="dashNetWorth">—</span>
      </div>
      <div class="summary-card">
        <span class="summary-label">Cash Balance</span>
        <span class="summary-value" id="dashCashBalance">—</span>
      </div>
      <div class="summary-card">
        <span class="summary-label">Portfolio Value</span>
        <span class="summary-value" id="dashPortfolioValue">—</span>
      </div>
      <div class="summary-card">
        <span class="summary-label">Unrealized P/L</span>
        <span class="summary-value" id="dashUnrealizedPnl">—</span>
      </div>
    </div>

    <div class="dashboard-split">
      <!-- Watchlist Target Alerts -->
      <div class="glass-panel">
        <div class="section-header">
          <h2>Watchlist &amp; Target Alerts</h2>
          <a href="../watchlist/watchlist.html" class="mini-link">Manage &rarr;</a>
        </div>
        <div id="watchlistAlerts" class="alerts-list">
          <p class="muted">Loading watchlist...</p>
        </div>
      </div>

      <!-- Market News (Finnhub Free Tier) -->
      <div class="glass-panel">
        <div class="section-header">
          <h2>Market Headlines</h2>
          <a href="../charts/charts.html" class="mini-link">Trade &rarr;</a>
        </div>
        <div id="marketNewsList" class="news-list">
          <p class="muted">Loading market news...</p>
        </div>
      </div>
    </div>

    <!-- TradingView Market Overview Widgets -->
    <div class="dashboard-grid">
      <div class="card small">
        <div class="tradingview-widget-container" style="height: 100%; width: 100%;">
          <div class="tradingview-widget-container__widget" style="height: 100%; width: 100%;"></div>
          <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js" async>
          {
            "symbol": "AMEX:SPY",
            "width": "100%",
            "height": "100%",
            "locale": "en",
            "dateRange": "12M",
            "colorTheme": "dark",
            "isTransparent": true,
            "autosize": true,
            "largeChartUrl": ""
          }
          </script>
        </div>
      </div>

      <div class="card small">
        <div class="tradingview-widget-container" style="height: 100%; width: 100%;">
          <div class="tradingview-widget-container__widget" style="height: 100%; width: 100%;"></div>
          <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js" async>
          {
            "symbol": "NASDAQ:QQQ",
            "width": "100%",
            "height": "100%",
            "locale": "en",
            "dateRange": "12M",
            "colorTheme": "dark",
            "isTransparent": true,
            "autosize": true,
            "largeChartUrl": ""
          }
          </script>
        </div>
      </div>

      <div class="card small">
        <div class="tradingview-widget-container" style="height: 100%; width: 100%;">
          <div class="tradingview-widget-container__widget" style="height: 100%; width: 100%;"></div>
          <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js" async>
          {
            "symbol": "SKILLING:BRENT",
            "width": "100%",
            "height": "100%",
            "locale": "en",
            "dateRange": "12M",
            "colorTheme": "dark",
            "isTransparent": true,
            "autosize": true,
            "largeChartUrl": ""
          }
          </script>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
