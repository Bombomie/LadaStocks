<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="apple-touch-icon" sizes="180x180" href="/Images/Favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="Images/Favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="Images/Favicon/favicon-16x16.png">
    <link rel="manifest" href="Images/Favicon/site.webmanifest">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LadaStocks</title>
  <link rel="stylesheet" href="watchlist.css" />
  <!-- Reusable navbar component (renders the header, active link,
       username and session guard). Needs no config. -->
  <script src="../shared/navbar.js" defer></script>
  <script src="watchlist.js" defer></script>
</head>
<body>
  <!-- The old copy-pasted <header> block was replaced by this one line.
       It renders the navbar and marks "Watchlist" active automatically. -->
  <lada-navbar></lada-navbar>

  <section class="content">
    <h1>Watchlist</h1>
    <hr>
    <div class="lower-grid">

            <div class="watchlist-panel">
        <h2>Stock Watchlists</h2>

        <div class="add-stock-bar">
          <div class="search-bar" style="position: relative;">
            <input type="text" class="search-input" id="stockSearch" placeholder="Add a symbol (e.g. NVDA)" autocomplete="off">
            <button class="search-btn" id="searchBtn" type="submit">
              <img src="../../Images/SVG/search.svg" class="search-icon" alt="Search">
            </button>
            <div id="suggestions" class="suggestions-list"></div>
          </div>
        </div>

                <div class="table-wrap">
          <table class="watchlist-table">
            <thead>
              <tr>
                <th>Symbol</th>
                <th>Company</th>
                <th>Price</th>
                <th>Target</th>
                <th>Change</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="watchlistBody"></tbody>
          </table>
        </div>
      </div>

      <div class="details-panel">
        <h2>Details</h2>
        <div id="detailsBody" class="details-body">
          <p class="details-empty">Select a stock from your watchlist to see details.</p>
        </div>
      </div>

    </div>

  </section>
</body>
</html>
