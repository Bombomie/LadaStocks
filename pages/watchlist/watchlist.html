<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="apple-touch-icon" sizes="180x180" href="/Images/Favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="Images/Favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="Images/Favicon/favicon-16x16.png">
    <link rel="manifest" href="Images/Favicon/site.webmanifest">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LadaStocks</title>
  <link rel="stylesheet" href="watchlist.css" />
  <script src="watchlist.js" defer></script>
</head>
<body>
  <header>
    <a href="../dashboard/dashboard.html" class="logo">
      <img src="../../Images/LadaStocks.png" alt="Lada Stocks logo">
    </a>

    <ul class="nav-links">
      <li><a href="../dashboard/dashboard.html">Dashboard</a></li>
      <li><a href="../portfolio/portfolio.html">Portfolio</a></li>
      <li><a href="../wallet/wallet.html">Wallet</a></li>
      <li><a href="../watchlist/watchlist.html" class="active">Watchlist</a></li>
      <li><a href="../transactions/transactions.html">Transactions</a></li>
      <li><a href="../charts/charts.html">Charts</a></li>
    </ul>

    <div class="nav-right">
      <span class="username">Username</span>
      <a href="../User/user.html">
        <img src="../../Images/profile.png" alt="User avatar" class="avatar">
      </a>
    </div>
  </header>
  <section class="content">
    <h1>Watchlist</h1>
    <hr>
    <div class="summary-strip" id="summaryStrip">
      <div class="summary-card">
        <span class="summary-label">Portfolio Value</span>
        <span class="summary-value" id="portfolioValue">$0.00</span>
      </div>
      <div class="summary-card">
        <span class="summary-label">Cash Balance</span>
        <span class="summary-value" id="cashBalance">$0.00</span>
      </div>
      <div class="summary-card">
        <span class="summary-label">Today's Change</span>
        <span class="summary-value" id="todaysChange">$0.00</span>
      </div>
      <div class="summary-card">
        <span class="summary-label">Total Return</span>
        <span class="summary-value" id="totalReturn">0.00%</span>
      </div>
    </div>
 
    <div class="lower-grid">
 
      <div class="watchlist-panel">
        <h2>Watchlist</h2>
        <div class="table-wrap">
          <table class="watchlist-table">
            <thead>
              <tr>
                <th>Symbol</th>
                <th>Company</th>
                <th>Price</th>
                <th>Change</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="watchlistBody">
            </tbody>
          </table>
        </div>
        <button class="add-symbol-btn" id="addSymbolBtn" type="button">+ Add symbol</button>
      </div>
 
      <div class="details-panel">
        <h2>Details</h2>
        <div id="detailsBody" class="details-body">
          <p class="details-empty">Select a stock from your watchlist to see details.</p>
        </div>
      </div>
 
    </div>
 
  </section>
</body>
</html>
